name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.11'

jobs:
  lint:
    name: Lint (erros críticos)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      # Gate objetivo: sintaxe, nomes indefinidos, imports/asserts inválidos.
      # (estilo E/W/I/N fica fora para não travar em código legado)
      - name: Ruff
        run: ruff check . --output-format=github

  typecheck:
    name: Type Check (informativo)
    runs-on: windows-latest
    timeout-minutes: 12
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy

      - name: MyPy
        run: mypy app/ core/ storage/ ui/ tools/ --ignore-missing-imports --show-error-codes

  test:
    name: Tests (pytest + coverage)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: Run Tests with Coverage
        run: |
          python -m pytest tests/ -v --cov=app --cov=core --cov=storage --cov=ui `
            --cov-report=xml --cov-report=term-missing

      - name: Upload Coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  build-exe:
    name: Build EXE (PyInstaller)
    runs-on: windows-latest
    timeout-minutes: 40
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile `
            --name AnotadorPad `
            --paths . `
            --exclude-module torch --exclude-module torchvision --exclude-module torchaudio `
            --exclude-module ultralytics --exclude-module loralib `
            --exclude-module matplotlib --exclude-module pandas --exclude-module scipy `
            --exclude-module sympy --exclude-module networkx --exclude-module numba `
            --exclude-module IPython --exclude-module notebook `
            --exclude-module tkinter --exclude-module PyQt5 --exclude-module PySide6 `
            --exclude-module tensorflow --exclude-module transformers `
            --hidden-import detector_anomalias `
            --hidden-import anomalias_modulo `
            --hidden-import core.dataset `
            --hidden-import core.detector_ia `
            --hidden-import core.detector_smart `
            --hidden-import core.datasheet `
            --hidden-import core.imgio `
            --hidden-import core.units `
            --hidden-import core.prefs `
            --hidden-import core.report `
            --hidden-import core.transform `
            --hidden-import core.state_manager `
            --hidden-import core.active_learning `
            --hidden-import core.kicad `
            --hidden-import core.dialogs `
            --hidden-import core.diff_viewer `
            --hidden-import core.plugin_system `
            main.py

      - name: Check EXE
        shell: pwsh
        run: |
          $exe = "./dist/AnotadorPad.exe"
          if (-not (Test-Path $exe)) { throw "EXE nao gerado" }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          if ($mb -lt 20) { throw "EXE suspeito: $mb MB" }
          Write-Host "EXE OK: $mb MB"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnotadorPad.exe
          path: dist/AnotadorPad.exe
          retention-days: 7

  release-draft:
    name: Create Draft Release
    runs-on: windows-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-exe]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AnotadorPad.exe
          path: ./dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AnotadorPad.exe
          draft: true
          generate_release_notes: true
