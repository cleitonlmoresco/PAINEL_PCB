name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.11'

jobs:
  lint-and-typecheck:
    name: Lint + Type Check
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Run Ruff (lint)
        run: ruff check . --output-format=github

      - name: Run Ruff (format check)
        run: ruff format --check . --output-format=github

      - name: Run MyPy (type check)
        run: mypy app/ core/ storage/ ui/ tools/ --ignore-missing-imports --show-error-codes

  test:
    name: Tests (pytest + coverage)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-mock

      - name: Run Tests with Coverage
        run: |
          python -m pytest tests/ -v --cov=app --cov=core --cov=storage --cov=ui \
            --cov-report=xml --cov-report=term-missing --cov-fail-under=35

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  build-exe:
    name: Build EXE (PyInstaller)
    runs-on: windows-latest
    timeout-minutes: 30
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build EXE
        run: |
          cd anotador-modular
          py -3.11 -m PyInstaller --noconfirm --clean --onefile `
            --name AnotadorPad `
            --paths . --paths .. `
            --hidden-import detector_anomalias `
            --hidden-import filtros_pcb `
            --hidden-import core.dataset `
            --hidden-import core.detector_ia `
            --hidden-import core.detector_smart `
            --hidden-import core.datasheet `
            --hidden-import core.imgio `
            --hidden-import core.units `
            --hidden-import core.prefs `
            --hidden-import core.report `
            --hidden-import core.transform `
            --add-data "..\imagens;imagens" `
            main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnotadorPad.exe
          path: anotador-modular/dist/AnotadorPad.exe
          retention-days: 7

  smoke-test:
    name: Smoke Test (headless)
    runs-on: windows-latest
    timeout-minutes: 10
    needs: [build-exe]
    steps:
      - uses: actions/checkout@v4
      - name: Download EXE
        uses: actions/download-artifact@v4
        with:
          name: AnotadorPad.exe
          path: ./dist

      - name: Run Smoke Test
        run: |
          # Testa se o EXE inicia sem erro (timeout 5s)
          timeout 5 ./dist/AnotadorPad.exe --help 2>&1 || true
          echo "Smoke test passed (EXE starts)"

  release-draft:
    name: Create Draft Release
    runs-on: windows-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-exe, smoke-test]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AnotadorPad.exe
          path: ./dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AnotadorPad.exe
          draft: true
          generate_release_notes: true